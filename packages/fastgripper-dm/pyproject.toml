[project]
name = "fastgripper-dm"
version = "0.0.1"
description = "FastGripper worm-gear gripper driver for Damiao DM-J4310 actuators on a dedicated CAN channel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["python-can>=4.0", "pyusb>=1.2", "gs_usb>=0.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fastgripper-dm = "fastgripper_dm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastgripper_dm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
